; Copiază acest fișier ca "config.ini" și completează datele tale.

[email]
; Server IMAP: Gmail = imap.gmail.com, Outlook/Hotmail = outlook.office365.com,
; Yahoo = imap.mail.yahoo.com
server = imap.gmail.com
port = 993
user = adresa.ta@gmail.com
; La Gmail/Yahoo/Outlook folosește o "parolă de aplicație" (App Password),
; nu parola obișnuită a contului.
password = parola-de-aplicatie
folder = INBOX

[filter]
; Opțional: descarcă doar mailurile de la acest expeditor (sau parte din adresă)
from =
; Opțional: doar mailurile al căror subiect conține acest text
subject =
; Doar mailuri primite în ultimele N zile (0 = fără limită)
days = 30
; yes = doar mailurile necitite
unseen_only = no

[output]
; Unde se salvează PDF-urile originale descărcate
download_dir = descarcate
; Unde se salvează PDF-urile procesate
output_dir = procesate
; Câte copii din prima pagină
first_page_copies = 2
; Câte pagini de la final (termeni și condiții)
last_pages = 3
