<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cirforvest · pornește</title>
<style>
:root { --bg: #f3f4f1; --fg: #1d2421; --muted: #5f6a65; --accent: #e0a100; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #141917; --fg: #e8ece9; --muted: #9aa5a0; --accent: #f0b52a; color-scheme: dark; } }
html { font: -apple-system-body; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: var(--bg); color: var(--fg); font-family: -apple-system, system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
.spin { width: 42px; height: 42px; border-radius: 50%; border: 4px solid rgba(127,127,127,.25); border-top-color: var(--accent); animation: s .9s linear infinite; }
@keyframes s { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
p { margin: 0; color: var(--muted); max-width: 30em; }
</style>
</head>
<body>
<div class="spin" aria-hidden="true"></div>
<h1 style="margin:0;font-size:1.3rem">Serverul pornește…</h1>
<p id="msg">Serverul gratuit doarme când nu e folosit. Durează până la un minut; pagina se deschide singură.</p>
<script>
(() => {
  const t0 = Date.now();
  async function check() {
    try {
      const r = await fetch("/ping", { cache: "no-store" });
      if (r.ok) { location.reload(); return; }
    } catch (e) {
      if (!navigator.onLine) document.getElementById("msg").textContent = "Telefonul nu are internet. Pagina se deschide când revine conexiunea.";
    }
    if (Date.now() - t0 > 120000) document.getElementById("msg").textContent = "Durează mai mult decât de obicei. Încerc în continuare…";
    setTimeout(check, 2000);
  }
  check();
})();
</script>
</body>
</html>
