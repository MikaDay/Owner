<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cirforvest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141917" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="{{ url_for('manifest') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
<title>{% block title %}Cirforvest{% endblock %}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #f3f4f1; --surface: #fff; --fg: #1d2421; --muted: #5f6a65; --line: #d7dbd6; --seg-bg: #e3e5e0; --seg-on: #fff;
  --accent: #e0a100; --accent-ink: #1d2421; --tc: #3f6e86; --ok: #2f7d4f; --err: #b3362b;
  --warn: #9a5b00; --warn-bg: #fdf1d6; --paper: #fff; --shade: rgba(20,25,23,.82);
  --body: "Archivo", -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141917; --surface: #1d2321; --fg: #e8ece9; --muted: #9aa5a0; --line: #333b38; --seg-bg: #262d2a; --seg-on: #3b4440;
          --accent: #f0b52a; --accent-ink: #141917; --tc: #7fb0c8; --ok: #5fbf85; --err: #ec6f63;
          --warn: #f0c060; --warn-bg: #3a2f17; --paper: #f4f4f2; --shade: rgba(0,0,0,.85); color-scheme: dark; }
}
* { box-sizing: border-box; }
/* Dynamic Type: pe iPhone, mărimea textului urmează Setări → Afișaj → Mărimea textului
   (17 pt implicit). Toate mărimile sunt în rem, deci se scalează împreună. */
html { font: -apple-system-body; }
@supports not (font: -apple-system-body) { html { font-size: 100%; } }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 1rem; line-height: 1.45;
  -webkit-text-size-adjust: 100%; }
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px;
  padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 120px max(16px, env(safe-area-inset-left)); }
h1 { font-weight: 800; font-size: 1.6rem; line-height: 1.1; margin: 0; letter-spacing: -0.01em; }
.label { font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.top { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
/* Legături mici („Ieși”, „Înapoi”) cu zonă de apăsare de 44 pt, fără să schimbe aspectul. */
.top a { color: var(--muted); font-size: 0.85rem; display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 44px;
  padding: 0 10px; margin: -12px -10px -12px 0; }
.muted { color: var(--muted); margin: 0; }
form.search { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
form.search label { display: flex; flex-direction: column; gap: 4px; font-size: 0.82rem; color: var(--muted); min-width: 0; }
form.search .wide { grid-column: span 3; }
input[type=text], input[type=number], input[type=password] {
  font: inherit; font-size: max(16px, 1rem); color: var(--fg); background: var(--surface); min-height: 44px;
  border: 1px solid var(--line); border-radius: 6px; padding: 10px; width: 100%; }
button, .btn { font: inherit; font-weight: 700; cursor: pointer; border-radius: 8px; padding: 12px 16px; min-height: 44px;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  border: 1.5px solid var(--fg); background: transparent; color: var(--fg); text-decoration: none; text-align: center; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button:disabled { opacity: .45; }
button:focus-visible, input:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--tc); outline-offset: 2px; }
button:active:not(:disabled), .btn:active, .newbtn:active { transform: scale(0.98); }
@media (prefers-reduced-motion: no-preference) { button, .btn, .newbtn { transition: transform .08s; } }
.err { color: var(--err); }
.list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 28px 1fr; gap: 2px 10px; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.row input { grid-row: span 2; width: 22px; height: 22px; accent-color: var(--accent); margin: 2px 0 0; }
.row .subj { font-weight: 700; overflow-wrap: anywhere; min-width: 0; }
.row .meta { font-family: var(--mono); font-size: 0.76rem; color: var(--muted); overflow-wrap: anywhere; min-width: 0; }
.badge { display: inline-block; font-family: var(--mono); font-size: 0.72rem; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--ok); color: var(--ok); margin-left: 6px; vertical-align: 1px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  padding: 12px max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.bar .in { max-width: 640px; margin: 0 auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bar .count { flex: 1 1 100%; font-size: 0.85rem; color: var(--muted); }
.bar button { flex: 1 1 0; white-space: nowrap; padding: 12px 10px; }
.bar button.primary { flex-grow: 1.6; }
/* Comutator cu segmente, ca în iOS: Toate / Necitite / Niciunul. */
.seg { display: flex; padding: 2px; border-radius: 9px; background: var(--seg-bg); width: 100%; }
.seg button { flex: 1; min-height: 40px; padding: 6px 8px; border: 0; border-radius: 7px; background: transparent;
  color: var(--fg); font-weight: 600; font-size: 0.88rem; position: relative; }
.seg button::after { content: ""; position: absolute; inset: -2px 0; }   /* zona de apăsare: 44 pt */
.seg .segl { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 40px; border-radius: 7px;
  color: var(--fg); text-decoration: none; font-weight: 600; font-size: 0.88rem; position: relative; }
.seg .segl::after { content: ""; position: absolute; inset: -2px 0; }
.seg .segl[aria-pressed="true"] { background: var(--seg-on); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
.seg button[aria-pressed="true"] { background: var(--seg-on); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
.pages { display: flex; gap: 5px; align-items: center; font-family: var(--mono); font-size: 0.78rem; color: var(--muted); flex-wrap: wrap; }
.pg { width: 22px; height: 30px; border-radius: 3px; display: grid; place-items: center; border: 1.5px solid var(--tc); color: var(--tc); }
.pg.tr { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pick { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
  border: 2px dashed var(--line); border-radius: 10px; padding: 26px 16px; cursor: pointer; background: var(--surface); }
.pick:hover { border-color: var(--accent); }
.pick strong { font-size: 1.1rem; }
.pick small { color: var(--muted); }
.pick.busy { border-color: var(--accent); border-style: solid; }
#pdf { position: absolute; width: 1px; height: 1px; opacity: 0; }
/* Pe telefon nu ai unde să tragi fișiere: chenarul devine un buton obișnuit. */
@media (pointer: coarse) { .pick { border-style: solid; border-width: 1.5px; padding: 18px 16px; } .pick .drag-hint { display: none; } }
#pdf:focus-visible + .pick { outline: 3px solid var(--tc); outline-offset: 2px; }
.small { font-size: 0.88rem; }
.vh { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); border: 0; opacity: 0; }
.newbtn { display: flex; flex-direction: column; gap: 4px; padding: 18px; border-radius: 10px; text-decoration: none;
  background: var(--accent); color: var(--accent-ink); }
.newbtn strong { font-size: 1.25rem; }
.newbtn small { font-size: 0.88rem; opacity: .85; }
.newbtn.busy { opacity: .7; pointer-events: none; }
.newbtn:focus-visible { outline: 3px solid var(--tc); outline-offset: 2px; }
.badge.read { border-color: var(--line); color: var(--muted); }
.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 14px; }
.steps ul { padding-left: 18px; margin: 6px 0 0; display: flex; flex-direction: column; gap: 6px; }
code { font-family: var(--mono); font-size: 0.85em; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; overflow-wrap: anywhere; }
.copy { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
.copy code { flex: 1; min-width: 0; padding: 8px; }
.copy button { padding: 8px 12px; font-size: 0.9rem; min-height: 44px; }
details summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; }
a.cta { display: block; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); text-decoration: none; }
a.cta b { color: var(--tc); }
.doc { display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.doc .head { display: flex; gap: 10px; align-items: center; }
.doc .head input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--accent); flex: none; margin: 0; }
/* Căsuța de bifat are în jur o zonă de apăsare de 44×44 pt. */
.doc .head .chk { display: grid; place-items: center; width: 44px; height: 44px; margin-left: -10px; flex: none; cursor: pointer; }
.doc .head input[type=text] { font-weight: 700; }
.doc .route { font-size: 0.92rem; }
.doc .src a { display: inline-flex; align-items: center; min-height: 44px; margin: -14px 0; color: var(--tc); }
.doc .src { font-family: var(--mono); font-size: 0.74rem; color: var(--muted); overflow-wrap: anywhere; }
.warn { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 8px 10px; font-size: 0.88rem; }
.thumbs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.thumb { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 0; border: 0; background: none; cursor: zoom-in; color: var(--muted); font-family: var(--mono); font-size: 0.7rem; font-weight: 400; }
.thumb canvas, .thumb .ph { width: 62px; display: block; background: var(--paper); border-radius: 2px; border: 2px solid var(--tc); }
.thumb .ph { height: 88px; background: var(--surface); border-style: dashed; border-color: var(--line); }
.thumb.tr canvas { border-color: var(--accent); }
.viewer { position: fixed; inset: 0; z-index: 20; background: var(--shade); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  padding: calc(16px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.viewer[hidden] { display: none; }
.viewer canvas { max-width: 100%; max-height: calc(100% - 60px); background: var(--paper); border-radius: 3px; }
.viewer .vbar { display: flex; gap: 10px; align-items: center; color: #fff; font-family: var(--mono); font-size: 0.85rem; white-space: nowrap; }
.viewer button { color: #fff; border-color: #fff; padding: 8px 14px; min-width: 44px; min-height: 44px; }
.viewer canvas { touch-action: none; transform-origin: center center; height: auto; max-height: none; }
.viewer .vhint { color: #fff; opacity: .7; font-size: 0.8rem; }
.startform { display: flex; flex-direction: column; gap: 8px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.startform label { font-size: 0.92rem; }
.startform .row2 { display: flex; gap: 8px; flex-wrap: wrap; }
.startform input[type=date] { font: inherit; font-size: 16px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); flex: 1 1 160px; }
h2.group { font-size: 1rem; margin: 6px 0 -12px; display: flex; gap: 8px; align-items: center; }
h2.group span { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 0 7px; }
.savedbox { background: var(--surface); color: var(--fg); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 10px; width: min(420px, 100%); }
.savedbox #savedlinks { display: flex; flex-direction: column; gap: 8px; }
.savedbox .btn { overflow-wrap: anywhere; font-size: 0.92rem; }
.savedbox button { color: var(--fg); border-color: var(--fg); }
.prog { height: 8px; border-radius: 4px; background: var(--seg-bg); overflow: hidden; }
.prog .fill { height: 100%; width: 0; background: var(--accent); border-radius: 4px; }
@media (prefers-reduced-motion: no-preference) {
  .prog .fill { transition: width .4s ease-out; }
  .prog.indet .fill { width: 30% !important; animation: indet 1.2s ease-in-out infinite; }
  @keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
}
@media (prefers-reduced-motion: reduce) { .prog.indet .fill { width: 100% !important; opacity: .35; } }
.sheet-back { position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; }
.sheet-back[hidden] { display: none; }
.sheet { background: var(--surface); color: var(--fg); width: min(640px, 100%); border-radius: 14px 14px 0 0;
  display: flex; flex-direction: column; gap: 10px;
  padding: 20px max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.sheet strong { font-size: 1.15rem; }
.sheet p { margin: 0; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .2s ease-out; } @keyframes up { from { transform: translateY(40px); opacity: 0; } } }
/* Bara de tab-uri de jos (navigarea principală). Bara de acțiuni (.bar) stă deasupra ei. */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; display: flex; justify-content: center;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 4px max(8px, env(safe-area-inset-right)) max(4px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
.tabs a { flex: 0 1 120px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px;
  justify-content: center; color: var(--muted); text-decoration: none; font-size: 0.68rem; font-weight: 600; }
.tabs a svg { width: 24px; height: 24px; fill: currentColor; }
.tabs a[aria-current="page"] { color: var(--tc); }
body.has-tabs .wrap { padding-bottom: calc(150px + env(safe-area-inset-bottom)); }
body.has-tabs .bar { bottom: calc(57px + env(safe-area-inset-bottom)); padding-bottom: 12px; }
/* Registru: rânduri, etichete de stare, carduri de rezumat. */
.cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
  display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: var(--fg); min-height: 44px; }
.card b { font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.card span { font-size: 0.82rem; color: var(--muted); }
.card.late { border-color: var(--err); }
.card.late b { color: var(--err); }
.card.wide { grid-column: span 2; }
.orow { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--line);
  text-decoration: none; color: var(--fg); min-height: 44px; }
.orow .t { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.orow .t b { font-family: var(--mono); font-size: 0.95rem; }
.orow .t span { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }
.chip.ok { border-color: var(--ok); color: var(--ok); }
.chip.late { border-color: var(--err); color: var(--err); font-weight: 700; }
.chip.soon { border-color: var(--warn); color: var(--warn); font-weight: 600; }
.chip.todo { border-color: var(--tc); color: var(--tc); }
.searchrow { display: flex; gap: 8px; }
.searchrow input { flex: 1; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
.kv dt { color: var(--muted); font-size: 0.85rem; }
.kv dd { margin: 0; overflow-wrap: anywhere; min-width: 0; }
.section { display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--surface); }
.section h2 { font-size: 1rem; margin: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0; }
.inline input[type=date], .inline input[type=text], .inline input[type=month] { flex: 1 1 150px; width: auto; }
input[type=date], input[type=month] { font: inherit; font-size: max(16px, 1rem); color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 10px; min-height: 44px; }
.step { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font-weight: 600; }
.step .dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
.step.done .dot { background: var(--ok); border-color: var(--ok); color: #fff; }
.step small { margin-left: auto; color: var(--muted); font-weight: 400; }
table.t { width: 100%; border-collapse: collapse; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
table.t th, table.t td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { color: var(--muted); font-weight: 600; font-size: 0.78rem; }
.scroll { overflow-x: auto; }
.wait { position: fixed; inset: 0; z-index: 30; background: rgba(20, 25, 23, 0.9); color: #fff; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 24px; }
.wait[hidden] { display: none; }
.wait strong { font-size: 1.15rem; }
.wait small { opacity: .8; }
.wait .t { font-family: var(--mono); font-size: 0.9rem; }
.spin { width: 42px; height: 42px; border-radius: 50%; border: 4px solid rgba(255,255,255,.25); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
</style>
<script>
// Ecran de așteptare pentru operațiile lungi (citirea mailului, procesarea PDF-urilor).
// Rămâne până se încarcă pagina următoare; la întoarcerea cu „Înapoi” dispare.
window.showWait = (text) => {
  const w = document.getElementById("wait");
  document.getElementById("waittext").textContent = text;
  w.hidden = false;
  const t0 = Date.now(), el = document.getElementById("waittime");
  clearInterval(window._waitTimer);
  window._waitTimer = setInterval(() => { el.textContent = Math.round((Date.now() - t0) / 1000) + " s"; }, 1000);
};
window.addEventListener("pageshow", () => {
  document.getElementById("wait").hidden = true;
  clearInterval(window._waitTimer);
  document.querySelectorAll("form[data-sent]").forEach((f) => delete f.dataset.sent);
});
// Un formular trimis o dată nu mai poate fi retrimis până nu răspunde serverul.
window.oncePerSubmit = (form, text) => form.addEventListener("submit", (e) => {
  if (form.dataset.sent) { e.preventDefault(); return; }
  form.dataset.sent = "1";
  showWait(typeof text === "function" ? text() : text);
});
</script>

<body class="{{ 'has-tabs' if tab else '' }}">
<div class="wrap">
{% block body %}{% endblock %}
</div>
{% if tab %}
{# Bara de tab-uri (navigarea principală, ca în iOS): doar pe paginile de nivel întâi. #}
<nav class="tabs" aria-label="Navigare">
  <a href="{{ url_for('index') }}" {% if tab == 'acasa' %}aria-current="page"{% endif %}>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    <span>Acasă</span></a>
  <a href="{{ url_for('orders') }}" {% if tab == 'comenzi' %}aria-current="page"{% endif %}>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm2 7v2h8v-2zm0 4v2h8v-2zm0-8v2h5V6z"/></svg>
    <span>Comenzi</span></a>
  <a href="{{ url_for('reports') }}" {% if tab == 'rapoarte' %}aria-current="page"{% endif %}>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10h3v10zm6.5 0V4h3v16zM17 20v-7h3v7z"/></svg>
    <span>Rapoarte</span></a>
