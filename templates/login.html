{% extends "base.html" %}
{% block body %}
<div><div class="label">Comandă transport · PDF</div><h1>Pagini transport</h1></div>
<form method="post" style="display:flex;flex-direction:column;gap:12px">
  <label for="password" class="muted">Parola site-ului</label>
  <input type="password" id="password" name="password" autocomplete="current-password" autofocus>
  {% if error %}<p class="err" style="margin:0">{{ error }}</p>{% endif %}
  <button class="primary" type="submit">Intră</button>
</form>
{% endblock %}
